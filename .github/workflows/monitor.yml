name: hiangle-monitor

on:
  schedule:
    - cron: "*/15 * * * *"      # 每 15 分钟（GitHub 高峰期可能延迟）
  workflow_dispatch:
    inputs:
      mode:
        description: "run = 正常跑一轮；dry = 演练不发通知；test-notify = 发测试通知；check = 逐码打印解析结果；probe = 探测候选店铺"
        default: run
        type: choice
        options: [run, dry, test-notify, check, probe]
      store:
        description: "check 用：店铺 id，填 all = 全部"
        default: all
        required: false
      targets:
        description: "probe 用：域名或商品链接，空格/逗号分隔"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: hiangle-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 跑监控
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          YAHOO_JP_APPID: ${{ secrets.YAHOO_JP_APPID }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          IN_STORE: ${{ github.event.inputs.store }}
          IN_TARGETS: ${{ github.event.inputs.targets }}
        run: |
          MODE="${{ github.event.inputs.mode || 'run' }}"
          if [ "$MODE" = "test-notify" ]; then python -m hmon test-notify; exit 0; fi
          if [ "$MODE" = "check" ]; then python -m hmon check "${IN_STORE:-all}"; exit 0; fi
          if [ "$MODE" = "probe" ]; then python -m hmon probe $IN_TARGETS; exit 0; fi
          if [ "$MODE" = "dry" ]; then python -m hmon run --dry-run; exit 0; fi
          python -m hmon run
      - name: 保存状态
        if: ${{ github.event.inputs.mode == 'run' || github.event_name == 'schedule' }}
        run: |
          git config user.name "hiangle-bot"
          git config user.email "hiangle-bot@users.noreply.github.com"
          git add -A state
          git diff --cached --quiet || git commit -m "state $(date -u +%FT%TZ)" -q
          git pull --rebase -q || true
          git push -q
